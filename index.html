<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鏡面人世 — 公式サイト</title>
  <meta name="description" content="鏡面人世（きょうめんじんせ）公式サイト。">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ヒーローセクション ───────────── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 60%, rgba(201,168,76,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 20%, rgba(61,42,16,0.5) 0%, transparent 50%);
      z-index: 0;
    }

    /* 波紋エフェクト */
    .hero-ripples {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .hero-ripples span {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(240,208,64,0.3);
      box-shadow: 0 0 10px rgba(240,208,64,0.08);
      width: 320px; height: 320px;
      /* margin で中心を自身の半分ズラして top/left が中心点になるようにする */
      margin-top: -160px;
      margin-left: -160px;
      animation: ripple-hero 7s ease-out infinite;
      /* delayの間もkeyframe 0%を適用 → フラッシュしない */
      animation-fill-mode: backwards;
    }
    /* 3つの中心をそれぞれズラす */
    .hero-ripples span:nth-child(1) { top: 48%; left: 58%; animation-delay: 0s;   }
    .hero-ripples span:nth-child(2) { top: 35%; left: 40%; animation-delay: 2.3s; }
    .hero-ripples span:nth-child(3) { top: 62%; left: 65%; animation-delay: 4.6s; }
    @keyframes ripple-hero {
      /* 0%をopacity:0にすることでフラッシュを防ぐ */
      0%   { transform: scale(0.15); opacity: 0;    }
      8%   { transform: scale(0.3);  opacity: 0.75; }
      100% { transform: scale(4.5);  opacity: 0;    }
    }

    /* 縦書きの大文字テキスト装飾 */
    .hero-kanji-deco {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--font-serif);
      font-size: clamp(5rem, 12vw, 11rem);
      font-weight: 700;
      color: rgba(201,168,76,0.06);
      letter-spacing: 0.1em;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 0 2.5rem;
      max-width: 700px;
      margin-left: max(5vw, 2.5rem);
    }

    .hero-en {
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      color: var(--kin);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .hero-en::before {
      content: '';
      width: 2.5rem; height: 1px;
      background: var(--kin);
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      animation: hero-in 1.2s var(--ease-out) both;
    }
    @keyframes hero-in {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-reading {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      color: var(--usuzumi);
      margin-bottom: 2.5rem;
      animation: hero-in 1.2s 0.2s var(--ease-out) both;
    }

    .hero-catch {
      font-family: var(--font-serif);
      font-size: clamp(0.85rem, 1.5vw, 1rem);
      line-height: 2;
      color: rgba(242,234,216,0.75);
      letter-spacing: 0.12em;
      margin-bottom: 3rem;
      animation: hero-in 1.2s 0.4s var(--ease-out) both;
      max-width: 30rem;
    }

    .hero-actions {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      animation: hero-in 1.2s 0.6s var(--ease-out) both;
    }

    /* ── ニュース欄 ─────────────────────── */
    .news-section { padding: var(--gap-xl) 0 0; }
    .news-list {
      display: flex; flex-direction: column;
      border: 1px solid rgba(201,168,76,0.15);
      background: rgba(37,26,12,0.3);
    }
    .news-item {
      display: flex; gap: 1rem;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid rgba(201,168,76,0.1);
      transition: background 0.25s;
      text-decoration: none; color: inherit; align-items: baseline;
    }
    .news-item:last-child { border-bottom: none; }
    .news-item:hover { background: rgba(61,42,16,0.5); }
    .news-item.no-link { cursor: default; }
    .news-item.no-link:hover { background: transparent; }
    .news-date {
      font-size: 0.68rem; letter-spacing: 0.12em;
      color: var(--kin); white-space: nowrap; flex-shrink: 0; min-width: 5.5rem;
    }
    .news-tag {
      font-size: 0.58rem; letter-spacing: 0.12em;
      padding: 1px 7px; border: 1px solid rgba(201,168,76,0.35);
      color: var(--usuzumi); white-space: nowrap; flex-shrink: 0;
    }
    .news-text {
      font-size: 0.82rem; letter-spacing: 0.06em;
      color: var(--washi); line-height: 1.6;
    }
    .news-empty {
      padding: 2rem; text-align: center;
      font-size: 0.78rem; letter-spacing: 0.15em; color: var(--usuzumi);
    }

    /* ── 最新楽曲 ────────────────────── */
    .latest-section {
      padding: var(--gap-xl) 0;
    }

    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.10);
      border: 1px solid rgba(201,168,76,0.10);
    }

    .songs-grid .song-card {
      background: var(--cha-deep);
      border: none;
    }
    .songs-grid .song-card:hover {
      background: rgba(61,42,16,0.7);
      transform: none;
    }

    .section-more {
      text-align: center;
      margin-top: 3rem;
    }

    /* ── アルバムプレビュー ───────────── */
    .albums-preview {
      padding: var(--gap-xl) 0;
    }

    .album-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .album-preview-card {
      display: block;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      transition: transform 0.4s var(--ease);
    }
    .album-preview-card:hover { transform: scale(0.98); }

    .album-cover {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .album-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(201,168,76,0.12) 0%, transparent 70%);
    }

    .album-cover-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      color: rgba(240,237,232,0.9);
      z-index: 1;
      text-align: center;
      line-height: 1.3;
    }
    .album-cover-title-en {
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      color: rgba(240,208,64,0.6);
      z-index: 1;
      text-align: center;
      margin-top: 0.3rem;
    }
    .album-cover-sub {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      z-index: 1;
      opacity: 0.6;
    }
    .album-cover-date {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      z-index: 1;
      opacity: 0.5;
    }

    /* グリッド装飾 */
    .album-cover-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── キャッチコピー帯 ────────────── */
    .quote-section {
      padding: var(--gap-xl) 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .quote-section::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.08);
    }
    .quote-text {
      font-family: var(--font-serif);
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: 0.25em;
      line-height: 2.2;
      color: rgba(240,237,232,0.6);
      position: relative;
      z-index: 1;
    }
    .quote-mark {
      font-size: 4rem;
      color: rgba(201,168,76,0.18);
      font-family: Georgia, serif;
      line-height: 0.5;
      display: block;
      margin-bottom: 1rem;
    }

    /* ── SNSセクション ──────────────────── */
    .sns-section {
      padding: 5rem 0 3rem;
    }

    .sns-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .sns-label {
      font-size: 0.62rem;
      letter-spacing: 0.45em;
      color: var(--kin);
      position: relative;
    }
    .sns-label::before,
    .sns-label::after {
      content: '';
      position: absolute;
      top: 50%; width: 2.5rem; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,0.35));
    }
    .sns-label::before {
      right: calc(100% + 0.8rem);
      background: linear-gradient(to left, transparent, rgba(201,168,76,0.35));
    }
    .sns-label::after { left: calc(100% + 0.8rem); }

    .sns-icons {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .sns-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(240,208,64,0.35);
      color: var(--hakkin);
      background: transparent;
      transition: color 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
      position: relative;
    }

    /* 発光エフェクト */
    .sns-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240,208,64,0.18) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sns-btn:hover {
      color: #fff;
      border-color: rgba(240,208,64,0.9);
      background: rgba(240,208,64,0.08);
      box-shadow:
        0 0 14px rgba(240,208,64,0.35),
        0 0 32px rgba(240,208,64,0.12),
        inset 0 0 8px rgba(240,208,64,0.08);
    }
    .sns-btn:hover::before { opacity: 1; }

    .sns-btn:active { transform: scale(0.93); }

    .sns-btn svg {
      width: 20px; height: 20px;
      fill: currentColor;
      display: block;
    }
  </style>
</head>
<body>

<!-- ナビゲーション -->
<header class="nav" id="nav">
  <a href="index.html" class="nav-logo">鏡面人世</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="songs.html">Songs</a>
    <a href="albums.html">Albums</a>
  </nav>
  <button class="nav-burger" id="burger" aria-label="メニュー">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- モバイルメニュー -->
<nav class="nav-mobile" id="mobile-menu">
  <a href="index.html">Home</a>
  <a href="songs.html">Songs</a>
  <a href="albums.html">Albums</a>
</nav>

<!-- ヒーロー -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-ripples">
    <span></span><span></span><span></span>
  </div>
  <div class="hero-kanji-deco" id="hero-kanji">鏡面人世</div>

  <div class="hero-content">
    <p class="hero-en">OFFICIAL SITE</p>
    <h1 class="hero-title" id="hero-title">鏡面人世</h1>
    <p class="hero-reading">Kyomen Jinse</p>
    <p class="hero-catch" id="hero-catch"></p>
    <div class="hero-actions">
      <a href="songs.html" class="btn btn-primary">楽曲一覧へ</a>
      <a href="albums.html" class="btn btn-accent">アルバムへ</a>
    </div>
  </div>

  </div>
</section>

<!-- ニュース -->
<section class="news-section">
  <div class="container">
    <div class="section-divider fade-in">
      <span class="section-label">News</span>
    </div>
    <h2 class="section-title fade-in">ニュース</h2>
    <div class="news-list fade-in" id="news-list"></div>
  </div>
</section>

<!-- 最新楽曲 -->
<section class="latest-section">
  <div class="container">
    <div class="section-divider fade-in">
      <span class="section-label">Latest Songs</span>
    </div>
    <h2 class="section-title fade-in">楽曲</h2>
    <div class="songs-grid fade-in" id="songs-grid"></div>
    <div class="section-more fade-in">
      <a href="songs.html" class="btn btn-primary">すべての楽曲を見る</a>
    </div>
  </div>
</section>

<!-- キャッチコピー帯 -->
<section class="quote-section">
  <div class="container">
    <p class="quote-text fade-in">
      <span class="quote-mark">"</span>
      浮世を映す鏡<br>
      〜The Mirror of the Floating World〜
    </p>
  </div>
</section>

<!-- アルバムプレビュー -->
<section class="albums-preview">
  <div class="container">
    <div class="section-divider fade-in">
      <span class="section-label">Albums</span>
    </div>
    <h2 class="section-title fade-in">アルバム</h2>
    <div class="album-preview-grid fade-in" id="album-grid"></div>
    <div class="section-more fade-in">
      <a href="albums.html" class="btn btn-primary">アルバム一覧へ</a>
    </div>
  </div>
</section>

<!-- SNS -->
<section class="sns-section">
  <div class="container">
    <div class="sns-inner fade-in">
      <p class="sns-label">FOLLOW</p>
      <div class="sns-icons" id="sns-icons"></div>
    </div>
  </div>
</section>

<!-- フッター -->
<footer class="footer"></footer>

<script src="data.js"></script>
<script src="main.js"></script>
<script>
  // ヒーロー文字を動的に入れる
  document.getElementById('hero-catch').textContent = SITE_INFO.catchphrase;

  // 楽曲グリッド（最新6曲）
  const grid = document.getElementById('songs-grid');
  SONGS.slice(0, 6).forEach(song => {
    grid.appendChild(createSongCard(song, true));
  });

  // アルバムグリッド
  const albumGrid = document.getElementById('album-grid');
  ALBUMS.forEach(album => {
    const card = document.createElement('a');
    card.href = `albums.html#${album.id}`;
    card.className = 'album-preview-card fade-in';
    const enLine = album.titleEn
      ? `<div class="album-cover-title-en">${album.titleEn}</div>` : '';

    // artworkあり→画像+グラデオーバーレイ、なし→CSS装飾
    const coverInner = album.artwork ? `
      <div class="album-cover" style="background-color:${album.coverColor}; position:relative;">
        <img src="${album.artwork}" alt="${album.titleJa || album.title}"
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(10,6,2,0.8) 0%,transparent 60%);z-index:1;"></div>
        <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0.3rem;margin-top:auto;padding:1.5rem;">
          <div class="album-cover-sub">${album.subtitle}</div>
          <div class="album-cover-title">${album.titleJa || album.title}</div>
          ${enLine}
        </div>
        <div class="album-cover-date">${album.releaseDate}</div>
      </div>
    ` : `
      <div class="album-cover" style="background-color:${album.coverColor};">
        <div class="album-cover-grid"></div>
        <div class="album-cover-sub">${album.subtitle}</div>
        <div class="album-cover-title">${album.titleJa || album.title}</div>
        ${enLine}
        <div class="album-cover-date">${album.releaseDate}</div>
      </div>
    `;
    card.innerHTML = coverInner;
    albumGrid.appendChild(card);
  });

  // ニュース一覧生成
  const newsList = document.getElementById('news-list');
  const news = typeof NEWS !== 'undefined' ? NEWS : [];
  if (news.length === 0) {
    newsList.innerHTML = '<p class="news-empty">ニュースはまだありません。</p>';
  } else {
    news.slice(0, 8).forEach(item => {
      const el = item.url ? document.createElement('a') : document.createElement('div');
      el.className = 'news-item' + (item.url ? '' : ' no-link');
      if (item.url) { el.href = item.url; el.target = '_blank'; el.rel = 'noopener'; }
      el.innerHTML = `
        <span class="news-date">${item.date}</span>
        <span class="news-tag">${item.tag || 'INFO'}</span>
        <span class="news-text">${item.text}</span>
      `;
      newsList.appendChild(el);
    });
  }

  // フェードイン再起動
  setTimeout(initFadeIn, 100);

  // SNSアイコン生成
  const SNS_LIST = [
    {
      key: 'youtubeUrl',
      label: 'YouTube',
      svg: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.7 15.5V8.5l6.3 3.5-6.3 3.5z"/>
      </svg>`
    },
    {
      key: 'tiktokUrl',
      label: 'TikTok',
      svg: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.6 3h-3.2v12.1a2.7 2.7 0 0 1-2.7 2.5 2.7 2.7 0 0 1-2.7-2.7 2.7 2.7 0 0 1 2.7-2.7c.3 0 .5 0 .8.1V8.9a6.1 6.1 0 0 0-.8-.1 6 6 0 0 0-6 6 6 6 0 0 0 6 6 6 6 0 0 0 6-6V8.5a9.5 9.5 0 0 0 5.5 1.7V7a6.3 6.3 0 0 1-5.6-4z"/>
      </svg>`
    },
    {
      key: 'instagramUrl',
      label: 'Instagram',
      svg: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.2 4.8 1.7 5 5 .1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.2 3.3-1.7 4.9-5 5-1.3.1-1.6.1-4.9.1s-3.6 0-4.8-.1c-3.3-.2-4.9-1.7-5-5C2.1 15.6 2 15.2 2 12s0-3.6.1-4.8c.2-3.3 1.7-4.9 5-5 1.3-.1 1.6-.1 4.9-.1zm0-2.2C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1.1 8.3 0 8.7 0 12s0 3.7.1 4.9C.3 21.3 2.7 23.7 7.1 23.9 8.3 24 8.7 24 12 24s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7C24 15.7 24 15.3 24 12s0-3.7-.1-4.9C23.7 2.7 21.3.3 16.9.1 15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 12 5.8zm0 10.2a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/>
      </svg>`
    }
  ];

  const snsContainer = document.getElementById('sns-icons');
  SNS_LIST.forEach(({ key, label, svg }) => {
    const url = SITE_INFO[key];
    if (!url || url === '#') {
      // URLが未設定でも枠は表示（薄くする）
    }
    const a = document.createElement('a');
    a.href = url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'sns-btn';
    a.setAttribute('aria-label', label);
    a.innerHTML = svg;
    if (!url || url === '#') a.style.opacity = '0.3';
    snsContainer.appendChild(a);
  });
</script>
</body>
</html>
