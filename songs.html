  <link rel="stylesheet" href="style.css">
  <style>
    .songs-page { padding-bottom: var(--gap-xl); }

    /* フィルター */
    .filter-bar {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .filter-btn {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      padding: 0.5rem 1.2rem;
      border: 1px solid rgba(201,168,76,0.18);
      color: var(--usuzumi);
      background: transparent;
      transition: all 0.3s var(--ease);
      cursor: pointer;
    }
    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--kin);
      color: var(--shiro);
      background: rgba(201,168,76,0.18);
    }

    /* 楽曲グリッド（トップページと同じスタイル） */
    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.10);
      border: 1px solid rgba(201,168,76,0.10);
    }

    .songs-grid .song-card {
      background: var(--cha-deep);
      border: none;
    }
    .songs-grid .song-card:hover {
      background: rgba(61,42,16,0.7);
      transform: none;
    }

    /* ============================================================
       songs.html 専用の追加スタイル
       理由：カードに「ジャケット画像」「英語サブタイトル」「リリース年」を
       表示する要件のため、新規クラスのみ追加している。
       style.css の既存ルール（.song-card, .song-card-track, .song-card-title,
       .song-card-reading, .song-card-desc, .song-card-tags 等）は
       一切変更していない。トップページ・楽曲詳細ページの見た目には影響しない。
       ============================================================ */
    .song-card-img {
      display: block;
      width: calc(100% + 3rem);     /* カードのpadding(1.5rem)分だけ外側へ広げて全幅表示 */
      margin: -1.5rem -1.5rem 1rem -1.5rem;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-bottom: 1px solid rgba(201,168,76,0.18);
    }
    .song-card-title-en {
      font-family: var(--font-serif);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: rgba(245,237,216,0.5);
      font-style: italic;
      margin-bottom: 0.3rem;
    }
    .song-card-year {
      color: var(--kin);
      opacity: 0.85;
    }

    /* ============================================================
       検索ボックス
       songs.html 専用。style.css には追加しない。
       ============================================================ */
    .search-wrap {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .search-input {
      width: 100%;
      background: rgba(10,6,2,0.6);
      border: 1px solid rgba(201,168,76,0.28);
      color: var(--washi);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      padding: 0.75rem 2.8rem 0.75rem 1rem;
      outline: none;
      transition: border-color 0.25s;
      -webkit-appearance: none;
      border-radius: 0;
    }
    .search-input::placeholder { color: var(--usuzumi); }
    .search-input:focus { border-color: rgba(201,168,76,0.7); }

    /* クリアボタン（✕） */
    .search-clear {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--usuzumi);
      font-size: 1rem;
      line-height: 1;
      padding: 0.3rem;
      display: none; /* 入力があるときだけ表示 */
      transition: color 0.2s;
    }
    .search-clear:hover { color: var(--kin-light); }

    /* 件数表示 */
    .songs-count {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--usuzumi);
      margin-bottom: 1.5rem;
    }

    /* 検索0件メッセージ */
    .search-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--usuzumi);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      line-height: 2;
    }
  </style>
</head>
<body>

<header class="nav" id="nav">
  <a href="index.html" class="nav-logo">鏡面人世</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="songs.html">Songs</a>
    <a href="albums.html">Albums</a>
  </nav>
  <button class="nav-burger" id="burger" aria-label="メニュー">
    <span></span><span></span><span></span>

</header>

<nav class="nav-mobile" id="mobile-menu">
  <a href="index.html">Home</a>
  <a href="songs.html">Songs</a>
  <a href="albums.html">Albums</a>
</nav>

<div class="page-header">
  <p class="page-header-en">SONGS</p>
  <h1 class="page-header-title">楽曲一覧</h1>
  <p class="page-header-desc">鏡に映る景色を、曲として。</p>
</div>

<main class="songs-page">
  <div class="container">
    <!-- 検索ボックス -->
    <div class="search-wrap fade-in">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="曲名・アルバム・タグで検索..."
        autocomplete="off"
        spellcheck="false"
        aria-label="楽曲を検索"
      >
      <button class="search-clear" id="search-clear" aria-label="検索をクリア">✕</button>
    </div>

    <!-- フィルター -->
    <div class="filter-bar fade-in" id="filter-bar">
      <button class="filter-btn active" data-album="all">すべて</button>
    </div>

    <!-- 件数 -->
    <p class="songs-count fade-in" id="songs-count"></p>

    <!-- 楽曲グリッド -->
    <div class="songs-grid fade-in" id="songs-list"></div>
  </div>
</main>

<footer class="footer"></footer>

<script src="data.js"></script>
<script src="main.js"></script>
<script>
  'use strict';

  // ── 状態管理 ─────────────────────────────────────
  // data.js は1回だけ読み込み済み。検索のたびに再取得しない。
  let currentAlbum = 'all';  // 選択中のアルバムフィルター
  let currentQuery = '';     // 検索クエリ（小文字に正規化済み）

  // ── フィルターボタン生成（アルバム別） ──────────
  const filterBar = document.getElementById('filter-bar');
  ALBUMS.forEach(album => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.album = album.id;
    btn.textContent = album.titleJa || album.title;
    filterBar.appendChild(btn);
  });

  // フィルター切り替え
  filterBar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentAlbum = btn.dataset.album;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  });

  // ── 検索処理 renderSearch() ──────────────────────
  /**
   * 検索ボックスへの入力をリアルタイムで処理する。
   *
   * 検索対象フィールド：
   *   title（日本語）/ titleEn（英語）/ id（ローマ字スラッグ）/
   *   アルバム名 / tags / description
   *
   * 大文字・小文字は区別しない（toLowerCase で正規化）。
   * 入力欄を空にすると全件表示へ戻る。
   * フィルター（アルバム）と検索クエリは AND 条件で絞り込む。
   */
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');

  searchInput.addEventListener('input', () => {
    currentQuery = searchInput.value.trim().toLowerCase();
    // クリアボタンの表示／非表示
    searchClear.style.display = currentQuery ? 'block' : 'none';
    renderList();
  });

  // ✕ ボタンで検索をリセット
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    currentQuery = '';
    searchClear.style.display = 'none';
    searchInput.focus();
    renderList();
  });

  /**
   * 1曲が現在のクエリに一致するかを判定する。
   * 複数フィールドをまとめた文字列に対して indexOf で部分一致チェック。
   */
  function matchesQuery(song, query) {
    if (!query) return true;
    const albumData = ALBUMS.find(a => a.id === song.album);
    const albumName = albumData ? (albumData.titleJa || albumData.title || '') : '';
    const tagsStr   = Array.isArray(song.tags) ? song.tags.join(' ') : '';
    const haystack  = [
      song.title        || '',
      song.titleEn      || '',
      song.id           || '',
      song.reading      || '',
      albumName,
      tagsStr,
      song.description  || '',
    ].join(' ').toLowerCase();
    return haystack.indexOf(query) !== -1;
  }

  // ── リスト描画 renderList() ──────────────────────
  /**
   * アルバムフィルター × 検索クエリ の AND 条件で絞り込んでカードを描画する。
   * 描画のたびに DOM を再構築する（innerHTML = '' でリセット）。
   * data.js の再取得は行わない（SONGS はグローバルで保持済み）。
   */
  function renderList() {
    const list  = document.getElementById('songs-list');
    const count = document.getElementById('songs-count');
    list.innerHTML = '';

    // ① アルバムフィルター
    const afterAlbum = currentAlbum === 'all'
      ? SONGS
      : SONGS.filter(s => s.album === currentAlbum);

    // ② 検索クエリで絞り込み
    const filtered = currentQuery
      ? afterAlbum.filter(s => matchesQuery(s, currentQuery))
      : afterAlbum;

    // 件数表示（全件 or 絞り込み中の件数を "N曲中M曲表示" 形式で表示）
    if (currentQuery || currentAlbum !== 'all') {
      const total = currentAlbum === 'all' ? SONGS.length : afterAlbum.length;
      count.textContent = filtered.length < total
        ? `${total}曲中 ${filtered.length}曲表示`
        : `${filtered.length} 曲`;
    } else {
      count.textContent = `${filtered.length} 曲`;
    }

    // 0件メッセージ
    if (filtered.length === 0) {
      list.innerHTML =
        '<p class="search-empty">' +
        '「' + escHtml(searchInput.value) + '」' +
        'に該当する楽曲が見つかりません。<br>別のキーワードをお試しください。' +
        '</p>';
      return;
    }

    // カード生成
    filtered.forEach(song => {
      list.appendChild(buildSongCardEl(song));
    });

    initFadeIn();
  }

  // XSS対策：ユーザー入力を innerHTML に埋め込む前にエスケープする
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * 楽曲データから1枚のカード要素を生成する（songs.html 専用）。
   *
   * main.js の createSongCard() は index.html・song.html でも共用されているため、
   * ここで仕様を拡張すると他ページの見た目まで変わってしまう。
   * そのため songs.html だけで完結するこの専用関数を用意し、
   * 既存ページのデザイン・挙動には一切影響を与えないようにしている。
   *
   * 表示項目：ジャケット画像／タイトル／英語サブタイトル／アルバム名／
   * リリース年／タグ（複数可・未設定なら非表示）／説明文（短縮）
   */
  function buildSongCardEl(song) {
    const albumData = ALBUMS.find(a => a.id === song.album);

    const card = document.createElement('a');
    card.href = `song.html?id=${song.id}`;
    card.className = 'song-card fade-in';

    // ジャケット画像：曲固有の artwork が設定されている場合のみ表示
    const artworkSrc = song.artwork || '';
    const imgHtml = artworkSrc
      ? `<img class="song-card-img" src="${artworkSrc}" alt="${escHtml(song.title || '')}" loading="lazy">`
      : '';

    // 英語サブタイトル
    const titleEnHtml = song.titleEn
      ? `<div class="song-card-title-en">${escHtml(song.titleEn)}</div>`
      : '';

    // リリース年
    const year = extractReleaseYear(song.releaseDate);
    const yearHtml = year ? ` <span class="song-card-year">／ ${year}</span>` : '';

    // タグ
    const tagsHtml = Array.isArray(song.tags) && song.tags.length > 0
      ? `<div class="song-card-tags">${song.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>`
      : '';

    const albumName  = albumData ? (albumData.titleJa || albumData.title) : '';
    const descShort  = truncateText(song.description, 60);

    card.innerHTML = `
      ${imgHtml}
      <div class="song-card-track">
        ${albumName ? escHtml(albumName) + ' — ' : ''}Track ${song.track ?? '-'}${yearHtml}
      </div>
      <div class="song-card-title">${escHtml(song.title || '')}</div>
      ${titleEnHtml}
      <div class="song-card-reading">${escHtml(song.reading || '')}</div>
      <div class="song-card-desc">${escHtml(descShort)}</div>
      ${tagsHtml}
    `;

    return card;
  }

  // "2024.03.21" → "2024"。パース不可なら空文字
  function extractReleaseYear(dateStr) {
    if (!dateStr) return '';
    const m = dateStr.match(/^(\d{4})/);
    return m ? m[1] : '';
  }

  // 説明文を指定文字数で短縮
  function truncateText(text, maxLength) {
    if (!text) return '';
    return text.length > maxLength ? text.slice(0, maxLength).trim() + '…' : text;
  }

  // 初期描画
  renderList();
</script>
</body>
</html>
